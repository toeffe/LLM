<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM</title>
  <link rel="icon" href="./favicon.ico" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>LLM</h1>
    <div class="header-tools">
      <select id="model" disabled></select>
      <span id="deviceMemory" class="size" hidden></span>
      <span class="status" id="status">Initializing…</span>
      <div id="chatsAnchor" class="settings-anchor">
        <button id="chatsToggle" class="text" type="button" aria-expanded="false" aria-controls="chatsPanel">Chats</button>
        <div id="chatsPanel" class="settings" role="region" aria-label="Chats">
          <div class="chat-actions">
            <button id="newChat" class="text" type="button">New chat</button>
            <button id="clearChats" class="text danger" type="button">Clear all</button>
          </div>
          <div id="chatList"></div>
        </div>
      </div>
      <div id="settingsAnchor" class="settings-anchor">
        <button id="settingsToggle" class="text" type="button" aria-expanded="false" aria-controls="settingsPanel">Settings</button>
        <div id="settingsPanel" class="settings" role="region" aria-label="Settings">
          <div class="field-row">
            <label class="field">Max tokens
              <input id="maxTokens" type="number" min="16" max="1024" step="16" />
            </label>
            <label class="field">Temperature
              <input id="temperature" type="number" min="0" max="2" step="0.1" />
            </label>
            <label class="field">Repeat penalty
              <input id="repeatPenalty" type="number" min="1" max="2" step="0.05" />
            </label>
          </div>
          <label class="check">
            <input id="thinking" type="checkbox" />
            Thinking
          </label>
          <label class="check">
            <input id="chippy" type="checkbox" />
            Toggle Chippy Mode
          </label>
          <label class="field" id="systemPromptField">System prompt
            <textarea id="systemPrompt" rows="4" readonly></textarea>
          </label>
          <label class="check">
            <input id="tts" type="checkbox" />
            TTS
          </label>
          <div class="speech-row">
            <label class="field">Voice
              <select id="ttsVoice"></select>
            </label>
            <label class="field">Speed
              <input id="ttsSpeed" type="number" min="0.5" max="2" step="0.1" />
            </label>
          </div>
          <label class="field">Output
            <select id="ttsOutput"></select>
          </label>
          <p class="hint">Speaks each finished sentence while the reply is still generating. 8.5 MB once, then about 25 MB. CPU only while speaking.</p>
        </div>
      </div>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </header>
  <p class="model-note" id="modelNote">The list is ordered by reserved memory.</p>

  <main>
    <div class="column">
      <div id="chat"></div>
      <div class="composer">
        <p class="context" id="contextLabel">Context 0%</p>
        <div class="controls">
          <textarea id="input" placeholder="Message" rows="1" disabled></textarea>
          <button id="clear" class="text" disabled>Clear</button>
          <button id="interrupt" class="text danger" type="button" hidden>Interrupt</button>
          <button id="send" disabled>Send</button>
        </div>
        <p class="site">
          LLM.T-tek.dev
        </p>
      </div>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
