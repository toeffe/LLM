<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>LLM</h1>
    <div class="header-tools">
      <label class="model-pick">
        Model
        <select id="model" disabled></select>
      </label>
      <span id="badge" class="size"></span>
      <span class="status" id="status">Initializing…</span>
      <div id="settingsAnchor" class="settings-anchor">
        <button id="settingsToggle" class="text" type="button" aria-expanded="false" aria-controls="settingsPanel">Settings</button>
        <div id="settingsPanel" class="settings" role="region" aria-label="Settings">
          <div class="field-row">
            <label class="field">Max tokens
              <input id="maxTokens" type="number" min="16" max="1024" step="16" />
            </label>
            <label class="field">Temperature
              <input id="temperature" type="number" min="0" max="2" step="0.1" />
            </label>
            <label class="field">Repeat penalty
              <input id="repeatPenalty" type="number" min="1" max="2" step="0.05" />
            </label>
          </div>
          <label class="check">
            <input id="thinking" type="checkbox" />
            Thinking
          </label>
          <label class="field">System prompt
            <textarea id="systemPrompt" rows="4"></textarea>
          </label>
          <div>
            <button id="resetPrompt" class="text" type="button">Reset prompt</button>
          </div>
        </div>
      </div>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </header>

  <main>
    <div class="column">
      <div id="chat"></div>
      <div class="composer">
        <div class="controls">
          <textarea id="input" placeholder="Message" rows="1" disabled></textarea>
          <button id="clear" class="text" disabled>Clear</button>
          <button id="send" disabled>Send</button>
        </div>
        <p class="site">
          LLM.T-tek.dev
          <span aria-hidden="true">·</span>
          <a href="https://huggingface.co/unsloth/Qwen3-0.6B-GGUF" target="_blank" rel="noopener">Qwen3-0.6B</a>
          <span aria-hidden="true">·</span>
          <a href="https://huggingface.co/jingyaogong/minimind-3-gguf" target="_blank" rel="noopener">MiniMind-3</a>
          <span aria-hidden="true">·</span>
          <a href="https://github.com/ngxson/wllama" target="_blank" rel="noopener">wllama</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
